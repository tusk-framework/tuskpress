services:
  web:
    build: .
    container_name: tuskpress_web
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      DB_HOST: mysql
      DB_NAME: wordpress
      DB_USER: root
      DB_PASSWORD: ''
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: tuskpress_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
